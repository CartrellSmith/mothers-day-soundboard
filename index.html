<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mother's Day Soundboard</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1 class="title">Mother's Day Soundboard 💖</h1>
    <p class="subtitle">Press any key (0-1) to play a sound 8 second sound!</p>

    <div id="soundboard" class="soundboard-grid">
        <button data-key="1"><span>1<br>Birds</span></button>
        <button data-key="2"><span>2<br>Chime</span></button>
        <button data-key="3"><span>3<br>Clapping</span></button>
        <button data-key="4"><span>4<br>Harp</span></button>
        <button data-key="5"><span>5<br>Heartbeat</span></button>
        <button data-key="6"><span>6<br>I Love You</span></button>
        <button data-key="7"><span>7<br>Kid Giggle</span></button>
        <button data-key="8"><span>8<br>Thank You</span></button>
        <button data-key="9"><span>9<br>Waterfall</span></button>
        <button data-key="0"><span>0<br>Wind</span></button>

        <audio data-key="1" src="assets/sounds/birds.mp3"></audio>
        <audio data-key="2" src="assets/sounds/chime.mp3"></audio>
        <audio data-key="3" src="assets/sounds/clapping.mp3"></audio>
        <audio data-key="4" src="assets/sounds/harp.mp3"></audio>
        <audio data-key="5" src="assets/sounds/heartbeat.mp3"></audio>
        <audio data-key="6" src="assets/sounds/i-love-you.mp3"></audio>
        <audio data-key="7" src="assets/sounds/kid-giggle.mp3"></audio>
        <audio data-key="8" src="assets/sounds/thank-you.mp3"></audio>
        <audio data-key="9" src="assets/sounds/waterfall.mp3"></audio>
        <audio data-key="0" src="assets/sounds/wind.mp3"></audio>
    </div>

    <script src="script.js"></script>
</body>

</html>
