<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mother's Day Soundboard</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
</head>

<body>
    <h1 class="title">💐Mother's Day Soundboard 💐</h1>
    <h2>"A mother's love is the heartbeat of the home."</h2>
    <p class="subtitle">Press any key (0-1) or click any button to play an 8 second sound!</p>

    <div id="soundboard" class="soundboard-grid">
        <button data-key="0"><span>0<br>Birds</span></button>
        <button data-key="1"><span>1<br>Chime</span></button>
        <button data-key="2"><span>2<br>Clapping</span></button>
        <button data-key="3"><span>3<br>Harp</span></button>
        <button data-key="4"><span>4<br>Heartbeat</span></button>
        <button data-key="5"><span>5<br>I Love You</span></button>
        <button data-key="6"><span>6<br>Kid Giggle</span></button>
        <button data-key="7"><span>7<br>Thank You</span></button>
        <button data-key="8"><span>8<br>Waterfall</span></button>
        <button data-key="9"><span>9<br>Wind</span></button>
        <audio data-key="0" src="assets/sounds/birds.mp3"></audio>
        <audio data-key="1" src="assets/sounds/chime.mp3"></audio>
        <audio data-key="2" src="assets/sounds/clapping.mp3"></audio>
        <audio data-key="3" src="assets/sounds/harp.mp3"></audio>
        <audio data-key="4" src="assets/sounds/heartbeat.mp3"></audio>
        <audio data-key="5" src="assets/sounds/i-love-you.mp3"></audio>
        <audio data-key="6" src="assets/sounds/kid-giggle.mp3"></audio>
        <audio data-key="7" src="assets/sounds/thank-you.mp3"></audio>
        <audio data-key="8" src="assets/sounds/waterfall.mp3"></audio>
        <audio data-key="9" src="assets/sounds/wind.mp3"></audio>
    </div>

    <footer class="footer">
        &copy; 2026 Cartrell D. Smith | MCA-NeXTStack
    </footer>
    <script src="script.js"></script>
</body>

</html>
